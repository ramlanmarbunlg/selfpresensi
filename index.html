<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Mandiri</title>

<link rel="icon" type="image/png" href="https://img.icons8.com/color/48/church.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
background:linear-gradient(135deg,#0F2A44,#1FA4A9);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
}
.presensi-card{
background:white;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,.3);
width:100%;
max-width:550px;
overflow:hidden;
}
.presensi-header{
background:linear-gradient(135deg,#0F2A44,#1FA4A9);
color:white;
padding:25px;
text-align:center;
}
.presensi-title{font-size:22px;font-weight:700;}
.logo{
width:70px;
height:70px;
object-fit:contain;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="presensi-card">
<div class="presensi-header">

<img id="churchLogo" class="logo" src="https://img.icons8.com/color/48/church.png">

<div class="presensi-title" id="churchName">Memuat...</div>
<div>Presensi Mandiri Jemaat</div>

</div>

<div class="presensi-body">

<div id="qr-reader"></div>

<div class="mt-3">
<input type="text" id="manualId" class="form-control" placeholder="Masukkan ID jemaat">
<button class="btn btn-primary mt-2 w-100" onclick="manualCheckin()">Submit</button>
</div>

<div id="result" style="margin-top:15px;"></div>

</div>
</div>

<script>

/* ========================================
   🔹 CONFIG
======================================== */
const API_URL = "https://selfpresensi.ramlanmarbungaol90.workers.dev";
const TOKEN = "PASTORA_2026_SECURE";

/* ========================================
   🔹 AMBIL PARAMETER CHURCH DARI URL
======================================== */
function getChurchId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("church") || "default";
}

/* ========================================
   🔹 LOAD DATA GEREJA (Nama + Logo)
======================================== */
document.addEventListener("DOMContentLoaded", function() {

  const church = getChurchId();

  fetch(`${API_URL}?action=getChurchName&church=${church}`)
  .then(res => res.json())
  .then(data => {

    document.getElementById("churchName").textContent =
      data.nama_gereja || "PASTORA CMS";

    if(data.logo_url){
      document.getElementById("churchLogo").src = data.logo_url;
    }

  })
  .catch(err => {
    console.error(err);
  });

});

/* ========================================
   🔹 QR SCANNER
======================================== */
let html5QrCode = null;
let lastScanned = '';

function initQRScanner(){
  html5QrCode = new Html5Qrcode("qr-reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps:10, qrbox:250 },
    onScanSuccess
  );
}

function onScanSuccess(decodedText){
  if(decodedText === lastScanned) return;
  lastScanned = decodedText;

  processPresensi(decodedText);
}

/* ========================================
   🔹 MANUAL INPUT
======================================== */
function manualCheckin(){
  const id = document.getElementById('manualId').value.trim();
  if(!id){
    alert("Masukkan ID");
    return;
  }
  processPresensi(id);
}

/* ========================================
   🔹 PROCESS PRESENSI
======================================== */
function processPresensi(qrData){

  const church = getChurchId();

  fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      qrData: qrData,
      church: church,
      token: TOKEN
    })
  })
  .then(res=>res.json())
  .then(res=>{
    document.getElementById("result").innerHTML =
      res.success ? "✅ "+res.message : "❌ "+res.message;
  })
  .catch(()=>{
    document.getElementById("result").innerHTML = "❌ Koneksi gagal";
  });

}

</script>

</body>
</html>
